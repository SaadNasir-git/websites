<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Codeinease — Logo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Dancing Script from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #FBF9F1;
      --ink: #000000;
      --outline: #FFFDF5;
      --svg-size: min(92vmin, 640px);
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      font-family: "Dancing Script", cursive;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .stage{
      width: var(--svg-size);
      height: var(--svg-size);
      display:block;
    }
    /* Optional: center page caption */
    .hint{
      text-align:center;
      margin-top:1rem;
      color:#333;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    body::selection{
        background: transparent;
        color: black;
    }
  </style>
</head>
<body>
  <!-- Inline SVG reproduction using Dancing Script.
       If you need absolute font-independence, ask for text->paths conversion. -->
  <svg class="stage" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="title desc">
    <title id="title">Codeinease logo</title>
    <desc id="desc">Stylized C and D with a small ornamental dot and the wordmark "codeinease".</desc>

    <!-- background -->
    <rect width="100%" height="100%" fill="none"/>

    <!-- Large left 'C' -->
    <!-- Position and sizes tuned to visually match the provided raster -->
    <text x="72" y="210"
          font-family="'Dancing Script', cursive"
          font-weight="400"
          font-size="280"
          fill="var(--ink)"
          dominant-baseline="alphabetic"
          text-anchor="start"
          style="letter-spacing:0">
      C
    </text>

    <!-- Right large 'D' stroke-only behind to create the off-white outline -->
    <text x="210" y="250"
          font-family="'Dancing Script', cursive"
          font-weight="400"
          font-size="280"
          fill="none"
          stroke="var(--outline)"
          stroke-width="22"
          stroke-linejoin="round"
          paint-order="stroke fill"
          dominant-baseline="alphabetic"
          text-anchor="start">
      D
    </text>

    <!-- Filled 'D' on top -->
    <text x="210" y="250"
          font-family="'Dancing Script', cursive"
          font-weight="400"
          font-size="280"
          fill="var(--ink)"
          dominant-baseline="alphabetic"
          text-anchor="start">
      D
    </text>

    <!-- small decorative curve inside the D (approximate stroke) -->
    <!-- This is a vector path to simulate the short curved stroke visible in the sample -->
    <path d="M 236 235
             q 12 -10 28 -18"
          fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wordmark centered under the letters -->
    <text x="256" y="350"
          font-family="'Dancing Script', cursive"
          font-size="44"
          font-weight="400"
          fill="var(--ink)"
          text-anchor="middle"
          dominant-baseline="middle"
          style="letter-spacing:0.5px">
      codeinease
    </text>
  </svg>

  <div class="hint">Save this file as <code>logo.html</code> and open it in your browser.</div>

</body>
</html>
